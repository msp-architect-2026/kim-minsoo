apiVersion: apps/v1
kind: Deployment
metadata:
  name: safe-edge-audio
  namespace: ai-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: safe-edge-audio
  template:
    metadata:
      labels:
        app: safe-edge-audio
    spec:
      # 🚨 [삭제] 기존의 깐깐한 nodeSelector는 지우거나 주석 처리합니다.
      # nodeSelector:
      #   kubernetes.io/hostname: worker2
      
      # 🚨 [신규 추가 1] worker2를 1순위로 선호하지만, 죽으면 다른 노드로 유연하게 대피하는 설정
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - worker2
                
      # 🚨 [신규 추가 2] 노드 장애 시 5분 대기하지 않고 30초 만에 즉시 대피(Failover)
      tolerations:
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 30
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 30

      containers:
      - name: audio-analyzer
        image: minsoo0919/safe-edge-audio:v2 
        securityContext:
          privileged: true
        volumeMounts:
        - name: dev-snd
          mountPath: /dev/snd
      volumes:
      - name: dev-snd
        hostPath:
          path: /dev/snd